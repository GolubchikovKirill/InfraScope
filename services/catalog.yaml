nodes:
  - id: frontend
    label: Frontend
    kind: gateway
    prometheus_job: ""
    service_map_enabled: true
  - id: backend
    label: API Gateway
    kind: gateway
    prometheus_job: backend
    service_map_enabled: true
  - id: worker
    label: Worker
    kind: worker
    prometheus_job: worker
    service_map_enabled: true
  - id: media-service
    label: Media Service
    kind: service
    prometheus_job: media-service
    service_map_enabled: true
  - id: jaeger
    label: Jaeger
    kind: infra
    prometheus_job: ""
    service_map_enabled: true
edges:
  - source: frontend
    target: backend
    transport: http
    operation: ui requests
  - source: backend
    target: media-service
    transport: http
    operation: media manifests

server {
    listen 80;
    server_name infrascope.local localhost _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name infrascope.local localhost _;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emits content-hashed filenames, so these are safe to cache forever.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # By default nginx resolves an upstream hostname once (at config load)
    # and keeps using that IP for the worker's lifetime. Every backend
    # rebuild/restart gives the "backend" container a new internal IP, so
    # without this, nginx silently keeps proxying to the old (now dead)
    # container until nginx itself is restarted - a recurring 502/connection
    # -refused outage after every backend deploy. Docker's embedded DNS at
    # 127.0.0.11 plus a $variable in proxy_pass forces a fresh lookup (with a
    # short TTL) on every request instead.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /api/v1/realtime/ws {
        # The access token travels as a query parameter here (browsers can't
        # set a custom header on a WebSocket handshake) - don't let it land
        # in the access log.
        access_log off;
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream/api/v1/realtime/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /health {
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
    }

    location /ready {
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
    }

    # /docs and /openapi.json are intentionally not proxied here - the API
    # schema and interactive docs shouldn't be reachable from outside the
    # network. Still served by the backend container directly on its own
    # port for anyone with internal/SSH access.

    gzip on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml
        image/svg+xml font/woff2 application/wasm;
    gzip_min_length 256;
}

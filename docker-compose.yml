services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-infrascope}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-infrascope}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 5s
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory ${REDIS_MAXMEMORY:-256mb} --maxmemory-policy ${REDIS_MAXMEMORY_POLICY:-allkeys-lru}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 3
      start_period: 5s
      timeout: 3s
    networks:
      - internal

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    restart: unless-stopped
    # The default in-memory span storage has no size cap of its own - it
    # grew to 2.45 GB RSS after 4 weeks of production tracing with nothing
    # ever evicted. This bounds it to the most recent N traces (LRU-evicted
    # past that), trading old traces for a flat memory ceiling.
    command:
      - "--memory.max-traces=${JAEGER_MEMORY_MAX_TRACES:-50000}"
    ports:
      - "${JAEGER_BIND:-127.0.0.1}:${JAEGER_PORT:-16686}:16686"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:16686"]
      interval: 20s
      retries: 6
      start_period: 20s
      timeout: 5s
    networks:
      - internal

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_SERVER: db
      REDIS_URL: redis://redis:6379/0
      MEDIA_LIBRARY_DIR: /var/lib/infrascope/media-library
      RUSTDESK_PACKAGE_DIR: /var/lib/infrascope/rustdesk
      NETWORK_CONTROL_SERVICE_ENABLED: ${NETWORK_CONTROL_SERVICE_ENABLED:-true}
      NETWORK_CONTROL_SERVICE_URL: http://network-control-service:8013
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      OTEL_SERVICE_NAMESPACE: ${OTEL_SERVICE_NAMESPACE:-infrascope}
    dns:
      - ${DNS_SERVER:-8.8.8.8}
    dns_search:
      - ${DNS_SEARCH_DOMAIN:-}
    volumes:
      - media_library:/var/lib/infrascope/media-library
      # the pinned RustDesk installer endpoints download from /remote-access/deploy/installer;
      # host-mounted (not a named volume) so it can be dropped in without a rebuild
      - ${RUSTDESK_PACKAGE_HOST_DIR:-./rustdesk-ksc/packages}:/var/lib/infrascope/rustdesk:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      retries: 3
      start_period: 30s
      timeout: 5s
    # See polling-service for why: defense in depth against the SNMP engine
    # socket leak (fixed in code, app/services/snmp), shared here since this
    # image is common to every service.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - internal

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_SERVER: db
      REDIS_URL: redis://redis:6379/0
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-6}
      WORKER_POOL: ${WORKER_POOL:-threads}
      WORKER_METRICS_PORT: ${WORKER_METRICS_PORT:-9108}
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      OTEL_SERVICE_NAMESPACE: ${OTEL_SERVICE_NAMESPACE:-infrascope}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_healthy
      backend:
        condition: service_healthy
    command:
      - sh
      - -c
      - celery -A app.worker.celery_app.celery_app worker --loglevel=INFO --pool=${WORKER_POOL:-threads} --concurrency=${WORKER_CONCURRENCY:-6}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${WORKER_METRICS_PORT:-9108}/')"]
      interval: 20s
      retries: 3
      start_period: 30s
      timeout: 5s
    # See polling-service for why.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - internal

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_SERVER: db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      worker:
        condition: service_healthy
    command:
      - sh
      - -c
      # /app isn't writable by the non-root "app" user (only its contents are,
      # from the build's --chown COPY), so point the schedule file at /tmp.
      - celery -A app.worker.celery_app.celery_app beat --loglevel=INFO --schedule=/tmp/celerybeat-schedule
    # See polling-service for why.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - internal

  ml-service:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_SERVER: db
      REDIS_URL: redis://redis:6379/0
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      OTEL_SERVICE_NAMESPACE: ${OTEL_SERVICE_NAMESPACE:-infrascope}
    command:
      - sh
      - -c
      - uvicorn app.ml_service.main:app --host 0.0.0.0 --port 8010
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health')"]
      interval: 20s
      retries: 3
      start_period: 30s
      timeout: 5s
    # See polling-service for why.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - internal

  polling-service:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_SERVER: db
      REDIS_URL: redis://redis:6379/0
      MEDIA_LIBRARY_DIR: /var/lib/infrascope/media-library
      POLLING_SERVICE_ENABLED: "false"
      DISCOVERY_SERVICE_ENABLED: "false"
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      OTEL_SERVICE_NAMESPACE: ${OTEL_SERVICE_NAMESPACE:-infrascope}
    command:
      - sh
      - -c
      - uvicorn app.polling_service.main:app --host 0.0.0.0 --port 8011
    dns:
      - ${DNS_SERVER:-8.8.8.8}
    dns_search:
      - ${DNS_SEARCH_DOMAIN:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8011/health')"]
      interval: 20s
      retries: 3
      start_period: 30s
      timeout: 5s
    # Defense in depth against the SNMP engine socket leak (fixed in code,
    # see app/services/snmp): the default 1024 was exhausted in ~2 days of
    # normal polling and every poll endpoint started returning 500
    # (OSError: [Errno 24] Too many open files). A raised ceiling buys time
    # to notice a future leak via monitoring instead of a hard outage.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - internal

  discovery-service:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_SERVER: db
      REDIS_URL: redis://redis:6379/0
      POLLING_SERVICE_ENABLED: "false"
      DISCOVERY_SERVICE_ENABLED: "false"
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      OTEL_SERVICE_NAMESPACE: ${OTEL_SERVICE_NAMESPACE:-infrascope}
    command:
      - sh
      - -c
      - uvicorn app.discovery_service.main:app --host 0.0.0.0 --port 8012
    dns:
      - ${DNS_SERVER:-8.8.8.8}
    dns_search:
      - ${DNS_SEARCH_DOMAIN:-}
    depends_on:
      redis:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8012/health')"]
      interval: 20s
      retries: 3
      start_period: 30s
      timeout: 5s
    # See polling-service for why.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - internal

  network-control-service:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_SERVER: db
      REDIS_URL: redis://redis:6379/0
      POLLING_SERVICE_ENABLED: "false"
      DISCOVERY_SERVICE_ENABLED: "false"
      NETWORK_CONTROL_SERVICE_ENABLED: "false"
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      OTEL_SERVICE_NAMESPACE: ${OTEL_SERVICE_NAMESPACE:-infrascope}
    command:
      - sh
      - -c
      - uvicorn app.network_control_service.main:app --host 0.0.0.0 --port 8013
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8013/health')"]
      interval: 20s
      retries: 3
      start_period: 30s
      timeout: 5s
    # See polling-service for why.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - internal

  media-service:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${MEDIA_SERVICE_BIND:-0.0.0.0}:${MEDIA_SERVICE_PORT:-8014}:8014"
    env_file: .env
    environment:
      POSTGRES_SERVER: db
      REDIS_URL: redis://redis:6379/0
      POLLING_SERVICE_ENABLED: "false"
      DISCOVERY_SERVICE_ENABLED: "false"
      NETWORK_CONTROL_SERVICE_ENABLED: "false"
      MEDIA_SERVICE_ENABLED: "false"
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      OTEL_SERVICE_NAMESPACE: ${OTEL_SERVICE_NAMESPACE:-infrascope}
    command:
      - sh
      - -c
      - uvicorn app.media_service.main:app --host 0.0.0.0 --port 8014
    volumes:
      - media_library:/var/lib/infrascope/media-library
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8014/health')"]
      interval: 20s
      retries: 3
      start_period: 30s
      timeout: 5s
    # See polling-service for why.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
      - "443:443"
    environment:
      HOST_IP: "${HOST_IP:-}"
    volumes:
      - ./certs:/etc/nginx/certs
    depends_on:
      backend:
        condition: service_healthy
      worker:
        condition: service_healthy
      ml-service:
        condition: service_healthy
      polling-service:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      network-control-service:
        condition: service_healthy
      media-service:
        condition: service_healthy
    networks:
      - internal

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.11.3@sha256:e4254400b85610324913f0dc4acf92603d9984e7519414c5a12811aa6146acc3}
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}"
    ports:
      - "${PROMETHEUS_BIND:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    depends_on:
      backend:
        condition: service_healthy
      polling-service:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      network-control-service:
        condition: service_healthy
      ml-service:
        condition: service_healthy
      media-service:
        condition: service_healthy
    networks:
      - internal

  # TCP-probes the RustDesk stack's ports (hbbs/hbbr have no shell to run an
  # in-container HEALTHCHECK against at all - see docs/remote-access-audit-2026-09.md
  # MED-3). ~/rustdesk is a separate compose project on its own bridge network,
  # but publishes these ports to the host, and `internal` is a plain bridge
  # (not `internal: true`), so this can reach 10.10.99.24 same as any other host.
  blackbox-exporter:
    image: ${BLACKBOX_EXPORTER_IMAGE:-prom/blackbox-exporter:v0.28.0@sha256:e753ff9f3fc458d02cca5eddab5a77e1c175eee484a8925ac7d524f04366c2fc}
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    networks:
      - internal

  # Host-level metrics. Nothing watched this host at all: the disk climbed to
  # 85% (unused images + build cache) with no signal until someone ran df.
  # The textfile collector also carries the "last successful DB backup" gauge
  # that scripts/backup-postgres.sh writes, so a backup that silently stops
  # running is alertable (see PostgresBackupStale in infrascope-alerts.yml).
  # Pulled from Quay, not Docker Hub: from this host Hub's CDN
  # (production.cloudfront.docker.com) dropped the layer download on every one
  # of 6 attempts, while quay.io serves the identical official image.
  node-exporter:
    image: ${NODE_EXPORTER_IMAGE:-quay.io/prometheus/node-exporter:v1.9.1}
    restart: unless-stopped
    pid: host
    command:
      - "--path.rootfs=/host"
      - "--collector.textfile.directory=/textfile"
      - "--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+|var/lib/containerd/.+)($$|/)"
    volumes:
      - /:/host:ro,rslave
      - ./backups/metrics:/textfile:ro
    networks:
      - internal

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana-oss:13.0.1@sha256:2d1f9ae67c1778d33e291d4c3c759cd8b650e67491f02533499eb950e075eeb5}
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "${GRAFANA_BIND:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started
    networks:
      - internal

volumes:
  postgres_data:
    name: infrascope_postgres_data
  redis_data:
    name: infrascope_redis_data
  prometheus_data:
    name: infrascope_prometheus_data
  grafana_data:
    name: infrascope_grafana_data
  media_library:
    name: infrascope_media_library

networks:
  internal:
    driver: bridge

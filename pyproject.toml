[project]
name = "infrascope"
version = "0.1.0"
description = "IT infrastructure monitoring and administration platform"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.30",
    "bcrypt>=4.2",
    "fastapi>=0.129.0",
    "httpx>=0.28",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.7",
    "pydantic[email]>=2.10",
    "pyjwt[crypto]>=2.10",
    "pysnmp>=7.1.27",
    "python-multipart>=0.0.18",
    "redis>=5.0",
    "slowapi>=0.1.9",
    "sqlmodel>=0.0.22",
    "uvicorn[standard]>=0.34",
    "paramiko>=3.5",
    "prometheus-fastapi-instrumentator>=7.1.0",
    "celery>=5.6.2",
    "opentelemetry-api>=1.38.0",
    "opentelemetry-exporter-otlp>=1.38.0",
    "opentelemetry-instrumentation-fastapi>=0.59b0",
    "opentelemetry-instrumentation-httpx>=0.59b0",
    "opentelemetry-sdk>=1.38.0",
    "jsonschema>=4.25.1",
    "pyyaml>=6.0.3",
    "python-docx>=1.2.0",
    "qrcode[pil]>=8.2",
    "python-tds>=1.16.1",
    "greenlet>=3.3.1",
    "pyrefly>=0.45.0",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "pytest>=8.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=1.3.0",
    "fakeredis>=2.26",
    "pyright>=1.1.414",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP",
    "B",      # flake8-bugbear: common bug patterns
    "C4",     # flake8-comprehensions
    "PIE",    # misc lint (redundant code)
    "RET",    # flake8-return
    "SIM",    # flake8-simplify
    "PERF",   # perflint
    "RUF",    # ruff-specific
    "N",      # pep8-naming
    "PLW",    # pylint warnings
    "PLE",    # pylint errors
    "TRY",    # tryceratops (exception handling style)
]
ignore = [
    "E501",
    # Below: rules that fire on patterns this codebase uses on purpose, not
    # bugs to fix. Each is a deliberate choice, not an oversight - see
    # docs/development-plan-2026-10.md phase C3.
    "TRY003",  # raise-vanilla-args: FastAPI HTTPException/ValueError need the
               # message inline; a custom exception class per call site would
               # be pure ceremony for one-shot API/validation errors.
    "RUF001",  # ambiguous-unicode-character-string: the product is in
    "RUF002",  # Russian; Cyrillic look-alikes in strings/docstrings are the
    "RUF003",  # actual, intended text, not typos.
    "PLR2004", # magic-value-comparison: SNMP/HTTP/protocol code compares
               # against numeric status codes and OIDs constantly; naming
               # every one of them would obscure the comparison, not clarify it.
    "PLR0913", # too-many-arguments: several polling/service functions take
               # more parameters than the default threshold by design (they
               # mirror a device's config); splitting them into a dataclass
               # is tracked separately, not enforced rule-by-rule here.
    "FBT001", "FBT002", "FBT003",  # boolean-trap: plenty of `bool` kwargs
               # here are genuinely boolean device/API flags (e.g. `full`,
               # `include_inactive`), not ambiguous positional booleans.
    "ARG001", "ARG002", "ARG005",  # unused-argument: FastAPI dependencies
               # (`current_user: CurrentUser` for auth-only routes) and
               # monkeypatched test doubles legitimately ignore parameters
               # required by the interface they implement.
    "PLC0415", # import-outside-top-level: used deliberately in a number of
               # places to break import cycles (each with its own comment);
               # auditing every remaining case is tracked separately.
    "PLR0911", "PLR0912", "PLR0915",  # complexity metrics (too many
               # returns/branches/statements): tracked as refactoring work
               # (development plan phase D), not a lint gate.
    "TRY300", # try-consider-else: valid in the simple one-statement cases
               # (fixed inline), but the multi-statement try blocks in the
               # polling/SSH code mix a success return with cleanup and a
               # narrower re-raise clause; moving those to `else` is a
               # real refactor, not a lint fix, and is not worth doing
               # blindly 20 times over.
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pyright]
include = ["app", "tests"]
venvPath = "."
venv = ".venv"
extraPaths = ["."]

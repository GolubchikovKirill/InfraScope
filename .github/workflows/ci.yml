name: CI

on:
  push:
    branches: [v2/vnk_deploy]
  pull_request:
    branches: [v2/vnk_deploy]
  workflow_dispatch:

env:
  NODE_VERSION: "22"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-descriptors:
    name: Validate Service Descriptors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Validate schema
        run: uv run python tools/scaffold/validate_service_descriptors.py

      - name: Generate observability assets
        run: uv run python tools/scaffold/generate_observability_assets.py

      - name: Ensure generated assets are up to date
        run: git diff --exit-code -- monitoring/prometheus/rules/service-targets.json monitoring/prometheus/rules/generated-service-alerts.yml monitoring/grafana/dashboards/infrascope-services-catalog.json

  # One required check for the backend instead of a per-service matrix plus a
  # hand-picked smoke subset: every service runs the same code from the same
  # image, so per-service jobs re-ran overlapping slices of the suite while the
  # full `pytest tests` was never run (it could not even be collected - two
  # modules shared a name).
  #
  # Python 3.14 to match the production image (Dockerfile). Local dev may stay
  # on 3.13 (.python-version); pyproject supports both.
  #
  # Tests run against PostgreSQL 17, the production engine, not SQLite:
  # case-insensitive matching, ON CONFLICT and locking behave differently and
  # recent bugs (hostname case sensitivity) lived exactly in that gap.
  backend:
    name: Backend (ruff + full test suite)
    runs-on: ubuntu-latest
    needs: validate-descriptors
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: infrascope_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d infrascope_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      UV_PYTHON: "3.14"
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/infrascope_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Ruff
        run: uv run ruff check app tests scripts
      - name: Tests
        run: uv run pytest tests -q

  frontend-test:
    name: Frontend Test
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:run

  frontend-e2e:
    name: Frontend E2E Smoke
    runs-on: ubuntu-latest
    needs: frontend-test
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright smoke tests
        run: npm run test:e2e

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: frontend-test
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

  platform-docker-build:
    name: Platform Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend-build, frontend-e2e]
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: infrascope-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: infrascope-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

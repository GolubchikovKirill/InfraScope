global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/infrascope-alerts.yml
  - /etc/prometheus/rules/generated-service-alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          host: infrascope-server

  - job_name: infrascope-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]

  - job_name: infrascope-worker
    metrics_path: /
    static_configs:
      - targets: ["worker:9108"]

  - job_name: infrascope-network-control-service
    metrics_path: /metrics
    static_configs:
      - targets: ["network-control-service:8013"]

  - job_name: infrascope-media-service
    metrics_path: /metrics
    static_configs:
      - targets: ["media-service:8014"]

  - job_name: infrascope-service-catalog
    file_sd_configs:
      - files: ["/etc/prometheus/rules/service-targets.json"]

  # hbbs/hbbr/api are a separate compose project (~/rustdesk) with no shell to
  # run an in-container HEALTHCHECK against - see
  # docs/remote-access-audit-2026-09.md MED-3. TCP-probed via blackbox-exporter
  # against the host's own published ports instead.
  - job_name: rustdesk-ports
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - "10.10.99.24:21114" # api (console)
          - "10.10.99.24:21116" # hbbs (id server)
          - "10.10.99.24:21117" # hbbr (relay)
        labels:
          job_label: rustdesk-ports
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
